# Copy gate: fails the PR if the built site contains dashes or AI-tell copy.
# Expected to FAIL until the Prompt 3 copy cleanup lands; after that it keeps
# new prose honest forever. See scripts/check-copy.mjs for what it checks.
name: check-copy

on:
  pull_request:
  workflow_dispatch:

jobs:
  check-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run audit:copy
